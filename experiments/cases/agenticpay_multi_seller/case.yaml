case_id: agenticpay_multi_seller
description: |
  1 Buyer, 2 Sellers, Escrow, Carrier. Buyer/Seller personas ADAPTED from the real
  SafeRL-Lab/AgenticPay negotiation agents (MIT); the escrow/carrier settlement layer and
  the N-party deadlock are AUTHORED (AgenticPay is negotiation-only). Unchecked, this is a
  3-node circular wait: Buyer withholds payment until both goods arrive; each Seller
  withholds shipment until paid. The escrow-first protocol releases per-seller after each
  confirmed delivery. Contracts are multi-dimensional (price, delivery_days, return_policy,
  packaging) per AgenticPay's contract_config.
version: v1
protocol_name: AgenticPayMultiSeller
roles: [Buyer, SellerA, SellerB, Escrow, Carrier]
terminal_label: SettlementComplete
max_steps: 40
branch_hints: [standard, standard]
role_descriptions:
  Buyer: real AgenticPay buyer (adapted); funds escrow once and confirms receipt per seller
  SellerA: real AgenticPay seller (adapted); ships after funds secured, paid after delivery
  SellerB: real AgenticPay seller (adapted); ships after funds secured, paid after delivery
  Escrow: authored; holds funds, releases to each seller only after that delivery is confirmed
  Carrier: authored; delivers each seller's goods and reports
intent: |
  Settle a purchase from TWO sellers using an Escrow and a Carrier. The Buyer negotiated a
  multi-dimensional contract with each seller (price, delivery_days in 1..14, return_policy,
  packaging). Fund the escrow once; the escrow tells each seller funds are secured; each
  seller ships; the carrier delivers; the buyer confirms receipt per seller; the escrow
  releases payment to each seller only after that seller's delivery is confirmed. Never
  release a seller's payment before that seller's goods are received.
goals:
  - {id: G1, category: liveness, description: settlement terminates, metric: settled, predicate: 'True', anchor: {sender: Escrow, receiver: Buyer, label: SettlementComplete}, threshold: terminal}
  - {id: G2, category: ordering, description: seller A paid after receipt, metric: releaseA, predicate: 'True', anchor: {sender: Escrow, receiver: SellerA, label: ReleaseA}, threshold: present}
  - {id: G3, category: ordering, description: seller B paid after receipt, metric: releaseB, predicate: 'True', anchor: {sender: Escrow, receiver: SellerB, label: ReleaseB}, threshold: present}
