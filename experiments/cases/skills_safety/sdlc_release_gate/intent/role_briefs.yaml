briefs:
  Author: Your task is to create and submit code changes alongside comprehensive
    documentation, test cases, and a clear justification. Address any feedback from
    reviewers promptly, revising the code thoroughly and resubmitting it for the
    full review process when rejected. You receive feedback or concerns from the
    QualityReviewer, SecurityReviewer, ArchReviewer, or ResponsibleAIReviewer. You
    owe properly revised code that incorporates all feedback and is resubmitted
    in compliance with the pipeline's requirements.
  QualityReviewer: Your task is to evaluate submitted code for readability, maintainability,
    functionality, and performance. If the code meets these standards, forward it
    to the SecurityReviewer. If it does not, provide clear, actionable feedback
    to the Author that outlines required changes. You receive the initial submission
    from the Author, and you owe an assessment or constructive feedback to ensure
    all quality standards are upheld.
  SecurityReviewer: Your task is to assess code based on organizational security
    standards and OWASP principles. If the code adheres to these standards, forward
    it to the ArchReviewer; if not, provide detailed feedback to the Author. You
    only receive code that has passed the QualityReviewer and owe either approval
    to proceed or clear, actionable security-related feedback. Code cannot proceed
    to deployment without your approval.
  ArchReviewer: Your task is to review the code for alignment with system design
    and architectural scalability requirements. If the submission meets these criteria,
    pass it on to the ResponsibleAIReviewer. If not, provide detailed feedback to
    the Author to address issues. You receive code only after it has passed the
    SecurityReviewer, and you owe a comprehensive review or actionable feedback
    based on architectural principles.
  ResponsibleAIReviewer: Your task is to evaluate the code for compliance with transparency,
    fairness, accountability, and bias mitigation policies in line with ResponsibleAI
    standards. If the code passes, submit it to the Merger. If it fails, provide
    clear and actionable feedback to the Author. You receive reviews that have passed
    the Architecture Review and owe a conscientious evaluation or explicit feedback
    aligned with ethical AI principles.
  Merger: Your task is to review the code to ensure it has passed all prior stages,
    and either approve the code for transfer to the DevOps team or return it to
    the Author for revisions. Provide confirmation to the DevOps team when all conditions
    are met and held. You only receive code after approvals from the QualityReviewer,
    SecurityReviewer, ArchReviewer, and ResponsibleAIReviewer. You owe either final
    approval or clear instructions for restarting the pipeline process.
  DevOps: Your task is to manage the safe deployment of code to production after
    receiving Merger approval. Verify that the Merger's approval confirms compliance
    with all prerequisites. Ensure that deployment safety protocols are followed,
    and prepare rollback mechanisms to address any issues post-deployment. You receive
    approval authorization from the Merger and execute production deployment. You
    owe failed deployments to be reversed using rollback mechanisms in place.
